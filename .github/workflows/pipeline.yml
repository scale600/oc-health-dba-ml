name: data-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}    # manual backfill

permissions:
  id-token: write   # OIDC -> Azure (azure/login)
  contents: write   # commit generated data

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r src/collector/requirements.txt \
                      -r src/etl/requirements.txt \
                      -r src/ml/requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow runner IP in SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner ip: $RUNNER_IP"
          az sql server firewall-rule create \
            -g oc-health-dba-ml -s oc-health-dba-ml \
            -n gh-runner \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      - name: Collect (public API)
        run: python -m src.collector.collect

      - name: Transform & load (SQL)
        run: python -m src.etl.run

      - name: ML (spatial hubs / archetypes / gaps)
        run: python -m src.ml.run

      - name: Export (SQL -> static JSON)
        run: python -m src.serve.export

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git commit -m "chore(data): refresh dashboard data" || echo "no data changes"
          git push

      - name: Remove runner IP from SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            -g oc-health-dba-ml -s oc-health-dba-ml \
            -n gh-runner 2>/dev/null || true
